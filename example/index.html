<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>argus: the philosopher</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b0a09; color: #a49a8c;
        font: 14px/1.6 ui-serif, Georgia, serif;
      }
      main { display: grid; gap: 1.5rem; justify-items: center; padding: 3rem 1rem; }
      #plate {
        position: relative; width: min(80vw, 420px); aspect-ratio: 4 / 5;
        filter: brightness(calc(0.35 + 0.65 * var(--lit, 1)));
      }
      #plate canvas, #plate img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
      #plate canvas { z-index: 1; }
      p { max-width: 42ch; text-align: center; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div id="plate">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <img src="./albedo.jpg" alt="An engraved portrait of an invented philosopher." />
      </div>
      <p>Move your cursor. He follows it, and looks away when you stop.</p>
    </main>
    <script type="module" src="./build/example/main.js"></script>
  </body>
</html>
